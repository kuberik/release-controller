apiVersion: kuberik.com/v1alpha1
kind: ReleaseSource
metadata:
  labels:
    app.kubernetes.io/name: release-controller
    app.kubernetes.io/managed-by: kustomize
  name: releasesource-sample
spec:
  oci:
    image: ghcr.io/example/app
    filterTags:
      pattern: '^main-(?P<ts>[0-9]+)-[a-f0-9]+$'
      extract: '$ts'
    policy:
      numerical:
        order: asc
